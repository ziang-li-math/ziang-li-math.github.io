<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Tucker labels and disjoint sets</title><desc id="desc">A diamond triangulated into eight triangles has antipodal boundary labels plus or minus 1 and 2. The highlighted edge is labelled plus 1 and minus 1. The right panel illustrates how comparable large set pairs with opposite labels give same-colored disjoint subsets.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="590" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="29" text-anchor="middle">Matoušek’s proof: signed pairs and Tucker labels</text><polygon points="260,309 440,309 350,219" fill="#dceffa" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 350,219 260,129" fill="#e8f5fd" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 260,129 170,219" fill="#dceffa" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 170,219 80,309" fill="#e8f5fd" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 80,309 170,399" fill="#dceffa" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 170,399 260,489" fill="#e8f5fd" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 260,489 350,399" fill="#dceffa" stroke="#9ac9e3" stroke-width="2"/><polygon points="260,309 350,399 440,309" fill="#e8f5fd" stroke="#9ac9e3" stroke-width="2"/><line x1="260" y1="309" x2="260" y2="489" stroke="#ce8a26" stroke-width="6" /><circle cx="440" cy="309" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="440" y="316" font-size="20" text-anchor="middle">+1</text><circle cx="350" cy="219" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="350" y="226" font-size="20" text-anchor="middle">+2</text><circle cx="260" cy="129" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="260" y="136" font-size="20" text-anchor="middle">+1</text><circle cx="170" cy="219" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="170" y="226" font-size="20" text-anchor="middle">−2</text><circle cx="80" cy="309" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="80" y="316" font-size="20" text-anchor="middle">−1</text><circle cx="170" cy="399" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="170" y="406" font-size="20" text-anchor="middle">−2</text><circle cx="260" cy="489" r="19" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="260" y="496" font-size="20" text-anchor="middle">−1</text><circle cx="350" cy="399" r="19" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="350" y="406" font-size="20" text-anchor="middle">+2</text><circle cx="260" cy="309" r="22" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="260" y="317" font-size="22" text-anchor="middle">+1</text><text x="260" y="100" font-size="23" text-anchor="middle">A two-dimensional Tucker labeling</text><text x="260" y="543" font-size="21" text-anchor="middle">Opposite boundary points have opposite labels.</text><text x="539" y="142" font-size="24" >A complementary edge decodes to:</text><rect x="533" y="183" width="375" height="102" rx="9" fill="#dceffa" stroke="#469ece"/><text x="720" y="222" font-size="24" text-anchor="middle">(A₁,B₁) = ({1,2},{3})</text><text x="720" y="262" font-size="22" text-anchor="middle">Label +j: color of {1,2}</text><line x1="720" y1="295" x2="720" y2="334" stroke="#469ece" stroke-width="2.4" marker-end="url(#arrow)"/><text x="747" y="321" font-size="21" >⊆ in both sides</text><rect x="533" y="346" width="375" height="102" rx="9" fill="#dceffa" stroke="#469ece"/><text x="720" y="385" font-size="23" text-anchor="middle">(A₂,B₂) = ({1,2},{3,4})</text><text x="720" y="425" font-size="22" text-anchor="middle">Label −j: color of {3,4}</text><text x="720" y="513" font-size="22" text-anchor="middle">{1,2} and {3,4}: disjoint, same color j.</text></g></svg>