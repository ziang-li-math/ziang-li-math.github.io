<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Degree as signed points</title><desc id="desc">Three positive points and one negative point trace a one-dimensional cobordism. One positive-negative pair joins in a cancellation arc and disappears. Two positive points remain, preserving degree two.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#c68c35" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="590" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="28" text-anchor="middle">A homotopy traces a cobordism: opposite signs cancel</text><rect x="92" y="144" width="808" height="322" rx="9" fill="#e5f4fd" stroke="#9ac9e3"/><path d="M92 155H900" fill="none" stroke="#9ac9e3" stroke-width="1.7" stroke-dasharray="6 5"/><path d="M92 455H900" fill="none" stroke="#9ac9e3" stroke-width="1.7" stroke-dasharray="6 5"/><path d="M53 438L53 173" fill="none" stroke="#469ece" stroke-width="2.8" marker-end="url(#arrow)"/><text x="20" y="139" font-size="26" >t</text><text x="67" y="164" font-size="22" >1</text><text x="67" y="463" font-size="22" >0</text><path d="M161 455C161 227 336 227 336 455" fill="none" stroke="#469ece" stroke-width="5" /><path d="M555 455V155" fill="none" stroke="#469ece" stroke-width="5" /><path d="M773 455V155" fill="none" stroke="#469ece" stroke-width="5" /><text x="248" y="219" font-size="26" text-anchor="middle">W = H⁻¹(y)</text><text x="248" y="345" font-size="21" text-anchor="middle">Cancellation arc</text><circle cx="161" cy="455" r="21" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="161" y="463" font-size="27" text-anchor="middle">+</text><circle cx="336" cy="455" r="21" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="336" y="463" font-size="27" text-anchor="middle">−</text><circle cx="555" cy="455" r="21" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="555" y="463" font-size="27" text-anchor="middle">+</text><circle cx="773" cy="455" r="21" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="773" y="463" font-size="27" text-anchor="middle">+</text><circle cx="555" cy="155" r="21" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="555" y="163" font-size="27" text-anchor="middle">+</text><circle cx="773" cy="155" r="21" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="773" y="163" font-size="27" text-anchor="middle">+</text><text x="102" y="506" font-size="23" >Initial count: 3 − 1 = 2</text><text x="545" y="114" font-size="23" >Final count: 2</text><text x="480" y="552" font-size="22" text-anchor="middle">The trace is smooth, even when a time slice has a cancellation event.</text></g></svg>