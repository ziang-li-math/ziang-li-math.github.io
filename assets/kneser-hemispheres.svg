<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Opposite hemispheres force disjoint subsets</title><desc id="desc">Five ground-set points lie on a sphere in general position. The left hemisphere contains 1 and 2, the right 3 and 4, and 5 lies on their equator. If opposite hemisphere centers belong to the same color region, the corresponding subsets have the same color and are disjoint.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="590" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="30" text-anchor="middle">Greene’s proof: opposite hemispheres</text><circle cx="269" cy="306" r="180" fill="url(#sphere)" stroke="#469ece" stroke-width="2.5"/><path d="M269 126A42 180 0 0 0 269 486" fill="none" stroke="#9ac9e3" stroke-width="2" stroke-dasharray="6 5"/><path d="M269 126A42 180 0 0 1 269 486" fill="none" stroke="#469ece" stroke-width="2"/><text x="150" y="109" font-size="26" text-anchor="middle">H(x)</text><text x="388" y="109" font-size="26" text-anchor="middle">H(−x)</text><circle cx="174.57408711170078" cy="261" r="11" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="190.57408711170078" y="268" font-size="23" >1</text><circle cx="250.6115335745377" cy="396" r="11" fill="#a9daf6" stroke="#469ece" stroke-width="2"/><text x="266.6115335745377" y="403" font-size="23" >2</text><circle cx="403.11730901702384" cy="234" r="11" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="419.11730901702384" y="241" font-size="23" >3</text><circle cx="386.21419768472396" cy="396" r="11" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="402.21419768472396" y="403" font-size="23" >4</text><circle cx="296.7803887661782" cy="171" r="11" fill="#ffffff" stroke="#469ece" stroke-width="2"/><text x="312.7803887661782" y="178" font-size="23" >5</text><line x1="78" y1="306" x2="40" y2="306" stroke="#469ece" stroke-width="2.4" marker-end="url(#arrow)"/><text x="24" y="284" font-size="24" >x</text><line x1="460" y1="306" x2="498" y2="306" stroke="#469ece" stroke-width="2.4" marker-end="url(#arrow)"/><text x="481" y="284" font-size="24" >−x</text><text x="269" y="532" font-size="21" text-anchor="middle">The equator belongs to neither open hemisphere.</text><text x="559" y="150" font-size="24" >Suppose x and −x both lie in Uᵢ.</text><rect x="554" y="193" width="350" height="95" rx="9" fill="#d9effc" stroke="#469ece"/><text x="729" y="232" font-size="25" text-anchor="middle">A ⊂ H(x)</text><text x="729" y="268" font-size="23" text-anchor="middle">A = {1,2}, color i</text><rect x="554" y="330" width="350" height="95" rx="9" fill="#d9effc" stroke="#469ece"/><text x="729" y="369" font-size="25" text-anchor="middle">B ⊂ H(−x)</text><text x="729" y="405" font-size="23" text-anchor="middle">B = {3,4}, color i</text><text x="729" y="482" font-size="23" text-anchor="middle">A ∩ B = ∅: same color is forbidden.</text></g></svg>