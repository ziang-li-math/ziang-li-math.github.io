<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">The Pontryagin-Thom collapse</title><desc id="desc">A schematic tube has its complement mapped to infinity. A full normal disk is then mapped to the two-sphere by identifying all its boundary points to one point. Its center maps to the chosen regular value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#c68c35" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="590" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="29" text-anchor="middle">Thicken, collapse, and forget the manifold coordinate</text><rect x="30" y="160" width="264" height="260" rx="10" fill="#e4eef4" stroke="#9ac9e3"/><path d="M162 206a105 75 0 1 0 0 150a105 75 0 1 0 0-150M162 247a65 34 0 1 1 0 68a65 34 0 1 1 0-68" fill="#bbdff4" fill-rule="evenodd" stroke="#9ac9e3" stroke-width="1.5"/><ellipse cx="162" cy="281" rx="85" ry="54" fill="none" stroke="#469ece" stroke-width="3"/><circle cx="247" cy="281" r="5" fill="#469ece" stroke="#469ece" stroke-width="2"/><path d="M228 281L266 281" fill="none" stroke="#c68c35" stroke-width="2.8" marker-end="url(#goldArrow)"/><text x="162" y="128" font-size="22" text-anchor="middle">Tube (schematic slice)</text><text x="162" y="465" font-size="23" text-anchor="middle">Outside → ∞</text><text x="162" y="504" font-size="22" text-anchor="middle">M → disk centers</text><path d="M307 287L349 287" fill="none" stroke="#469ece" stroke-width="2.8" marker-end="url(#arrow)"/><circle cx="480" cy="286" r="106" fill="#d9effc" stroke="#c68c35" stroke-width="3" stroke-dasharray="5 4"/><circle cx="480" cy="286" r="5" fill="#469ece" stroke="#469ece" stroke-width="2"/><text x="490" y="309" font-size="23" >0</text><path d="M480 286L544 254" fill="none" stroke="#469ece" stroke-width="2.8" marker-end="url(#arrow)"/><text x="547" y="254" font-size="24" >u</text><text x="480" y="128" font-size="23" text-anchor="middle">One normal disk D²</text><text x="480" y="465" font-size="23" text-anchor="middle">Identify all of ∂D²</text><text x="480" y="504" font-size="19" text-anchor="middle">Use the same rule in every fiber</text><path d="M602 287L647 287" fill="none" stroke="#469ece" stroke-width="2.8" marker-end="url(#arrow)"/><circle cx="795" cy="286" r="111" fill="url(#sphere)" stroke="#469ece" stroke-width="2.4"/><ellipse cx="795" cy="286" rx="111" ry="28" fill="none" stroke="#9ac9e3" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="795" cy="175" r="6" fill="#f5dfab" stroke="#c68c35" stroke-width="2"/><text x="807" y="172" font-size="24" >∞</text><circle cx="795" cy="327" r="5" fill="#469ece" stroke="#469ece" stroke-width="2"/><text x="808" y="345" font-size="21" >y = [0]</text><text x="795" y="128" font-size="23" text-anchor="middle">The quotient is S²</text><text x="795" y="465" font-size="22" text-anchor="middle">∂D² → one basepoint</text><text x="795" y="504" font-size="22" text-anchor="middle">0 → regular value y</text><text x="480" y="552" font-size="21" text-anchor="middle">Each normal disk remembers coordinates; the coordinate m is forgotten.</text></g></svg>