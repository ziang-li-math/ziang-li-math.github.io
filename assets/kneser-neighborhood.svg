<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">The neighborhood complex of a five-cycle</title><desc id="desc">Vertex 1 has neighbors 0 and 2. Those vertices become the highlighted edge of the neighborhood complex, another five-cycle drawn in cyclic order 0,2,4,1,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="570" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="30" text-anchor="middle">From a common neighbor to a simplex</text><line x1="237" y1="158" x2="363.4905166672554" y2="249.900739748132" stroke="#469ece" stroke-width="3" /><line x1="363.4905166672554" y1="249.900739748132" x2="315.17543855489896" y2="398.59926025186803" stroke="#469ece" stroke-width="3" /><line x1="315.17543855489896" y1="398.59926025186803" x2="158.8245614451011" y2="398.59926025186803" stroke="#469ece" stroke-width="3" /><line x1="158.8245614451011" y1="398.59926025186803" x2="110.50948333274457" y2="249.90073974813203" stroke="#469ece" stroke-width="3" /><line x1="110.50948333274457" y1="249.90073974813203" x2="237" y2="158" stroke="#469ece" stroke-width="3" /><circle cx="237" cy="158" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="237" y="166" font-size="25" text-anchor="middle">0</text><circle cx="363.4905166672554" cy="249.900739748132" r="24" fill="#f5dfab" stroke="#469ece" stroke-width="2"/><text x="363.4905166672554" y="257.90073974813197" font-size="25" text-anchor="middle">1</text><circle cx="315.17543855489896" cy="398.59926025186803" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="315.17543855489896" y="406.59926025186803" font-size="25" text-anchor="middle">2</text><circle cx="158.8245614451011" cy="398.59926025186803" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="158.8245614451011" y="406.59926025186803" font-size="25" text-anchor="middle">3</text><circle cx="110.50948333274457" cy="249.90073974813203" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="110.50948333274457" y="257.900739748132" font-size="25" text-anchor="middle">4</text><line x1="727" y1="158" x2="853.4905166672554" y2="249.900739748132" stroke="#ce8a26" stroke-width="5" /><line x1="853.4905166672554" y1="249.900739748132" x2="805.175438554899" y2="398.59926025186803" stroke="#469ece" stroke-width="3" /><line x1="805.175438554899" y1="398.59926025186803" x2="648.824561445101" y2="398.59926025186803" stroke="#469ece" stroke-width="3" /><line x1="648.824561445101" y1="398.59926025186803" x2="600.5094833327446" y2="249.90073974813203" stroke="#469ece" stroke-width="3" /><line x1="600.5094833327446" y1="249.90073974813203" x2="727" y2="158" stroke="#469ece" stroke-width="3" /><circle cx="727" cy="158" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="727" y="166" font-size="25" text-anchor="middle">0</text><circle cx="853.4905166672554" cy="249.900739748132" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="853.4905166672554" y="257.90073974813197" font-size="25" text-anchor="middle">2</text><circle cx="805.175438554899" cy="398.59926025186803" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="805.175438554899" y="406.59926025186803" font-size="25" text-anchor="middle">4</text><circle cx="648.824561445101" cy="398.59926025186803" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="648.824561445101" y="406.59926025186803" font-size="25" text-anchor="middle">1</text><circle cx="600.5094833327446" cy="249.90073974813203" r="24" fill="#e4f3fc" stroke="#469ece" stroke-width="2"/><text x="600.5094833327446" y="257.900739748132" font-size="25" text-anchor="middle">3</text><line x1="430" y1="289" x2="530" y2="289" stroke="#469ece" stroke-width="2.4" marker-end="url(#arrow)"/><text x="480" y="255" font-size="25" text-anchor="middle">N(·)</text><text x="237" y="109" font-size="25" text-anchor="middle">Graph C₅</text><text x="727" y="109" font-size="25" text-anchor="middle">Neighborhood complex N(C₅)</text><text x="237" y="473" font-size="23" text-anchor="middle">1 is adjacent to 0 and 2.</text><text x="727" y="473" font-size="23" text-anchor="middle">So {0,2} becomes a simplex.</text><text x="480" y="533" font-size="23" text-anchor="middle">Both spaces are circles, but their edges express different relations.</text></g></svg>