<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">Regular-value inverse images have a normal framing</title><desc id="desc">A closed circle in a three-dimensional chart carries a radial and a transverse normal direction at each point. The derivative maps those normal directions to an oriented basis at a regular value in the target two-sphere.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#469ece" stroke-width="1.5"/></marker><marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#c68c35" stroke-width="1.5"/></marker><radialGradient id="sphere" cx=".32" cy=".24" r=".8"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#bcdff4"/></radialGradient></defs><rect width="960" height="590" rx="16" fill="#f2faff"/><g font-family="Georgia, 'Times New Roman', serif" fill="#254d66"><text x="480" y="53" font-size="30" text-anchor="middle">A regular value reveals a framed manifold</text><rect x="51" y="134" width="384" height="305" rx="12" fill="#e7f5fd" stroke="#9ac9e3"/><path d="M361.00,304.00L360.77,307.67L360.08,311.33L358.93,314.96L357.32,318.55L355.27,322.08L352.78,325.54L349.86,328.91L346.53,332.18L342.79,335.35L338.65,338.39L334.15,341.29L329.29,344.05L324.09,346.64L318.58,349.08L312.77,351.33L306.69,353.39L300.37,355.26L293.82,356.93L287.07,358.39L280.15,359.64L273.10,360.66L265.92,361.46L258.66,362.04L251.35,362.38L244.00,362.50L236.65,362.38L229.34,362.04L222.08,361.46L214.90,360.66L207.85,359.64L200.93,358.39L194.18,356.93L187.63,355.26L181.31,353.39L175.23,351.33L169.42,349.08L163.91,346.64L158.71,344.05L153.85,341.29L149.35,338.39L145.21,335.35L141.47,332.18L138.14,328.91L135.22,325.54L132.73,322.08L130.68,318.55L129.07,314.96L127.92,311.33L127.23,307.67L127.00,304.00L127.23,300.33L127.